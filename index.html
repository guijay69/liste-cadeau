<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noël 2027 – Guillaume</title>
<meta name="description" content="La liste de cadeaux de Noël de Guillaume">
<style>
  :root {
    --bg1: #07131f;
    --bg2: #0d2a2a;
    --glass: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.14);
    --text: #f3f7f5;
    --muted: #a9bdb6;
    --accent: #ff5a4e;
    --accent2: #ffb84d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255,90,78,.25), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,184,77,.16), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Neige */
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .snow i {
    position: absolute; top: -10px;
    width: var(--s); height: var(--s);
    background: #fff; border-radius: 50%; opacity: .6;
    animation: fall var(--d) linear infinite; animation-delay: var(--delay);
  }
  @keyframes fall {
    to { transform: translateY(105vh) translateX(var(--x)); }
  }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }

  header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 64px 20px 28px;
  }
  .pill {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--glass);
    border-radius: 999px;
    font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
    backdrop-filter: blur(8px);
  }
  h1 {
    margin: 18px 0 10px;
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    line-height: 1.05;
    letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, var(--accent2) 55%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0 auto; max-width: 520px; color: var(--muted); font-size: 1.05rem; }

  main {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: 24px 20px 56px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 22px;
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    text-decoration: none; color: inherit;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,184,77,.55);
    box-shadow: 0 18px 40px rgba(0,0,0,.4);
  }

  .media {
    position: relative;
    aspect-ratio: 4 / 3;
    background: #fff;
    display: grid; place-items: center;
  }
  .media img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 14px;
    transition: transform .35s ease;
  }
  .card:hover .media img { transform: scale(1.06); }

  .fallback {
    position: absolute; inset: 0;
    display: none; place-items: center;
    font-size: 4rem;
    background: linear-gradient(135deg, #1c3d4a, #3a1f2b);
  }
  .media.noimg .fallback { display: grid; }
  .media.noimg img { display: none; }

  .store {
    position: absolute; top: 12px; left: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: .72rem; font-weight: 700; letter-spacing: .04em;
    background: rgba(7,19,31,.85); color: #fff;
    backdrop-filter: blur(6px);
  }
  .num {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: .8rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a0d0b;
  }

  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .body h2 { margin: 0; font-size: 1.12rem; line-height: 1.3; }
  .body p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.5; flex: 1; }

  .cta {
    margin-top: 10px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 700; font-size: .95rem;
    color: #1a0d0b;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    transition: filter .2s, gap .2s;
  }
  .card:hover .cta { filter: brightness(1.08); gap: 12px; }

  footer {
    position: relative; z-index: 1;
    text-align: center; color: var(--muted);
    padding: 0 20px 40px; font-size: .85rem;
  }
</style>
</head>
<body>

<div class="snow" id="snow" aria-hidden="true"></div>

<header>
  <span class="pill">🎄 Noël 2027</span>
  <h1>La liste de Guillaume</h1>
  <p>Mes idées cadeaux, avec les liens pour les trouver facilement 🎁</p>
</header>

<main id="list"></main>

<footer>Fait avec ❤ pour Noël 2027</footer>

<script>
  /* ============================================================
     ✏️  TA LISTE DE CADEAUX — modifie seulement cette partie
     - image : lien de la photo (https://...) OU fichier envoyé
               dans le dépôt, ex : "images/sac.jpg"
     - Si l'image est vide ou introuvable, un visuel de secours
       avec l'emoji s'affiche automatiquement.
     ============================================================ */
  const gifts = [
    {
      title: "Sac de sport Adidas Defender Duffel 22,5 L",
      desc: "Un sac de sport pratique pour l'entraînement et les déplacements.",
      store: "Decathlon",
      emoji: "🎒",
      image: "images/sac-adidas.jpg",
      url: "https://www.decathlon.fr/p/sac-de-sport-adidas-defender-duffel-22-5-l/387338/m9034046"
    },
    {
      title: "Compresseur d'air portatif Oasser",
      desc: "Compresseur portatif avec écran d'affichage et rangement, parfait pour la voiture.",
      store: "Amazon",
      emoji: "🚗",
      image: "images/compresseur.jpg",
      url: "https://www.amazon.fr/dp/B0D3KM6T9T"
    },
    {
      title: "Rangement de coffre de voiture (lot de 2)",
      desc: "Organisateurs de coffre avec élastiques pour garder la voiture bien rangée.",
      store: "Amazon",
      emoji: "🧰",
      image: "images/rangement-coffre.jpg",
      url: "https://www.amazon.fr/dp/B0CYSZXZ56"
    },
    {
      title: "Idée cadeau n°4",
      desc: "Article de la liste (fabrication française, plusieurs couleurs disponibles).",
      store: "Amazon",
      emoji: "🎁",
      image: "images/idee-4.jpg",
      url: "https://www.amazon.fr/dp/B0CCLFG94L"
    },
    {
      title: "Claquettes Puma Popcat",
      desc: "Claquettes noires pour homme, confortables à la maison comme à la piscine.",
      store: "Amazon",
      emoji: "🩴",
      image: "images/claquettes-puma.jpg",
      url: "https://www.amazon.fr/dp/B07S6NSZ8N"
    },
    {
      title: "Support téléphone magnétique UGREEN",
      desc: "Support de voiture magnétique compatible MagSafe pour smartphone.",
      store: "Amazon",
      emoji: "📱",
      image: "images/support-telephone.jpg",
      url: "https://www.amazon.fr/dp/B0D2Q5M35Y"
    }
  ];
  /* ============================================================ */

  const list = document.getElementById("list");

  gifts.forEach((g, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = g.url;
    a.target = "_blank";
    a.rel = "noopener";

    const media = document.createElement("div");
    media.className = "media" + (g.image ? "" : " noimg");

    if (g.image) {
      const img = document.createElement("img");
      img.src = g.image;
      img.alt = g.title;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", () => media.classList.add("noimg"));
      media.appendChild(img);
    }

    const fb = document.createElement("div");
    fb.className = "fallback";
    fb.textContent = g.emoji || "🎁";
    media.appendChild(fb);

    const store = document.createElement("span");
    store.className = "store";
    store.textContent = g.store;
    media.appendChild(store);

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = i + 1;
    media.appendChild(num);

    const body = document.createElement("div");
    body.className = "body";
    const h2 = document.createElement("h2");
    h2.textContent = g.title;
    const p = document.createElement("p");
    p.textContent = g.desc;
    const cta = document.createElement("span");
    cta.className = "cta";
    cta.textContent = "Voir le produit →";
    body.append(h2, p, cta);

    a.append(media, body);
    list.appendChild(a);
  });

  // Neige
  const snow = document.getElementById("snow");
  for (let i = 0; i < 28; i++) {
    const f = document.createElement("i");
    f.style.left = Math.random() * 100 + "%";
    f.style.setProperty("--s", (2 + Math.random() * 4) + "px");
    f.style.setProperty("--d", (8 + Math.random() * 10) + "s");
    f.style.setProperty("--delay", (-Math.random() * 15) + "s");
    f.style.setProperty("--x", (Math.random() * 80 - 40) + "px");
    snow.appendChild(f);
  }
</script>

</body>
</html>
